# display-mcp under Docker Compose — the container equivalent of
# `setup.sh install`. deploy/CONTAINER.md walks through it.
#
#   cp deploy/compose.env.example deploy/.env    # then edit it
#   docker compose -f deploy/compose.yaml up -d
#
# cloudflared is not here: it runs in its own LXC on a tunnel-only network
# (CONTAINER.md, "Network"), and reaches the MCP listener at this host's
# address on that network.
#
# Host networking, deliberately. The bind rules — panel on the LAN address
# plus 127.0.0.1, MCP on 127.0.0.1 plus the tunnel network's address, never a
# wildcard, never the MCP endpoint on the LAN — are about the host's
# interfaces. With a bridge network the process would see only a container
# address, and publishing ports would put Docker's NAT rules in between.
# Sharing the host's network namespace keeps every address in DISPLAY_MCP_*
# meaning exactly what it means under systemd.

name: display-mcp

services:
  display-mcp:
    image: ${DISPLAY_MCP_IMAGE:-ghcr.io/OWNER/display-mcp:latest}
    network_mode: host
    restart: unless-stopped
    environment:
      DISPLAY_MCP_PANEL_BIND: ${DISPLAY_MCP_PANEL_BIND:?set DISPLAY_MCP_PANEL_BIND to "<lan-ip>,127.0.0.1" in deploy/.env}
      DISPLAY_MCP_PANEL_PORT: ${DISPLAY_MCP_PANEL_PORT:-8080}
      # "<tunnel-net-ip>,127.0.0.1". A non-loopback address here is refused
      # at startup unless both Access settings below are set.
      DISPLAY_MCP_MCP_HOST: ${DISPLAY_MCP_MCP_HOST:-127.0.0.1}
      DISPLAY_MCP_MCP_PORT: ${DISPLAY_MCP_MCP_PORT:-8001}
      DISPLAY_MCP_MCP_PATH: /mcp
      # Both unset -> authless, which is accepted only on loopback alone.
      DISPLAY_MCP_CF_ACCESS_TEAM_DOMAIN: ${DISPLAY_MCP_CF_ACCESS_TEAM_DOMAIN:-}
      DISPLAY_MCP_CF_ACCESS_AUD: ${DISPLAY_MCP_CF_ACCESS_AUD:-}
      # Optional Host-header allowlist, e.g. mcp.example.com (mcp_server.py).
      DISPLAY_MCP_ALLOWED_HOSTS: ${DISPLAY_MCP_ALLOWED_HOSTS:-}
    volumes:
      - state:/var/lib/display-mcp
    # The systemd unit's confinement, as far as Compose can say it.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

volumes:
  state:
