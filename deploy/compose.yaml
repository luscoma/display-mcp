# display-mcp under Docker Compose — the container equivalent of
# `setup.sh install [--with-tunnel]`. deploy/CONTAINER.md walks through it.
#
#   cp deploy/compose.env.example deploy/.env    # then edit it
#   docker compose -f deploy/compose.yaml up -d                     # panel + MCP
#   docker compose -f deploy/compose.yaml --profile tunnel up -d    # + cloudflared
#
# Host networking on both services, deliberately. The settled bind rules —
# panel on the LAN address plus 127.0.0.1 and never a wildcard, MCP on
# loopback only, the tunnel the only edge — are about the host's interfaces.
# With a bridge network the process would see only a container address, and
# publishing ports would put Docker's NAT rules between the panel and the LAN.
# Sharing the host's network namespace keeps every address in DISPLAY_MCP_*
# meaning exactly what it means under systemd, and lets cloudflared reach
# 127.0.0.1:8001 the same way it does today.

name: display-mcp

services:
  display-mcp:
    image: ${DISPLAY_MCP_IMAGE:-ghcr.io/OWNER/display-mcp:latest}
    network_mode: host
    restart: unless-stopped
    environment:
      DISPLAY_MCP_PANEL_BIND: ${DISPLAY_MCP_PANEL_BIND:?set DISPLAY_MCP_PANEL_BIND to "<lan-ip>,127.0.0.1" in deploy/.env}
      DISPLAY_MCP_PANEL_PORT: ${DISPLAY_MCP_PANEL_PORT:-8080}
      DISPLAY_MCP_MCP_HOST: 127.0.0.1
      DISPLAY_MCP_MCP_PORT: ${DISPLAY_MCP_MCP_PORT:-8001}
      DISPLAY_MCP_MCP_PATH: /mcp
      # Both unset -> the MCP endpoint is authless; startup logs it loudly.
      DISPLAY_MCP_CF_ACCESS_TEAM_DOMAIN: ${DISPLAY_MCP_CF_ACCESS_TEAM_DOMAIN:-}
      DISPLAY_MCP_CF_ACCESS_AUD: ${DISPLAY_MCP_CF_ACCESS_AUD:-}
    volumes:
      - state:/var/lib/display-mcp
    # The systemd unit's confinement, as far as Compose can say it.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  # The only edge. Its public hostname's service, set in the Zero Trust
  # dashboard, stays http://localhost:8001 — host networking means that is
  # the same loopback the MCP listener is bound to.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Empty -> cloudflared exits at once, saying so; only the tunnel profile starts it.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - display-mcp

volumes:
  state:
