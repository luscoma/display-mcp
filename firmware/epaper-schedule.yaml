########################################################################
# Waveshare ESP32-S3-ePaper-13.3E6 — display-list build
#
# The firmware is a renderer, not a design. It fetches a few KB of JSON,
# executes it against the panel, and sleeps. Changing the layout is a file
# edit on the server; only the vocabulary below (110 fonts -- petrona,
# instrument and karla, each regular/bold/italic, plus mono, each at 11
# sizes -- eleven icons, the op set in display_list.h) is compiled in.
#
# No online_image, so no 3.84 MB PSRAM decode buffer.
#
# Source of truth: display-mcp/firmware/. display_list.h and secrets.yaml
# (gitignored) sit next to this file; build with `esphome run` from here.
########################################################################

substitutions:
  device_name: epaper-13e6
  friendly_name: E-Paper Schedule

  # The display-list server. Raw IP on purpose: the panel's DNS view has
  # already changed under it once, and a dead name leaves the wall frozen on
  # its last image with nothing in the log but a failed fetch.
  dl_url: "http://172.17.247.125:8080/display.json"

  sleep_minutes: "60min"
  max_awake: "4min"

  # How long a wake lingers before deep sleep so an OTA can get its
  # connection in — but only on a wake the boot button caused, never on the
  # hourly timer. Pressing the button is already the "I am standing at the
  # panel and I want it" signal; a window on every wake would be ~0.8 mAh of
  # idle radio an hour, about 20 mAh/day, to be ready for something that
  # happens twice a month. This way it is free until it is wanted, which is
  # what lets it be generous.
  flash_window: "30s"

  epd_clk_pin: "9"
  epd_data0_pin: "46"
  epd_data1_pin: "17" # no MISO on this board; inert spare pin
  epd_cs0_pin: "10"
  epd_cs1_pin: "3"
  epd_reset_pin: "2"
  epd_busy_pin: "12"
  epd_power_pin: "1"
  batt_adc_pin: "8"
  boot_button_pin: "0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - display_list.h
  on_boot:
    priority: -100
    then:
      # Why this wake happened, which is the whole basis for holding the board
      # open afterwards (see flash_window). esp_sleep.h comes in with
      # deep_sleep's own header. A cold boot reports UNDEFINED and is
      # deliberately NOT treated as a press: a brownout loop on a flat battery
      # would then hold 30 s every time it restarted, which is exactly when
      # the panel can least afford it. Press the button after a power-on.
      - lambda: |-
          const auto cause = esp_sleep_get_wakeup_cause();
          id(woke_by_button) = cause == ESP_SLEEP_WAKEUP_EXT0 ||
                               cause == ESP_SLEEP_WAKEUP_EXT1 ||
                               cause == ESP_SLEEP_WAKEUP_GPIO;
          // Counted here and not in wake_cycle, which also runs from the
          // refresh_now action and both template buttons: X-Panel-Wakes is
          // meant to be comparable against the hourly schedule, so a manual
          // refresh must not look like an extra wake.
          id(diag_wakes) += 1;
          // Say why we are up, at INFO, so a log tail can tell a timer wake
          // from a button, a power cycle or a crash. On 2026-09-19 an extra
          // wake 52 s after sleeping went unexplained for want of this line.
          ESP_LOGI("dl", "boot: wake cause %d, reset reason %d, wake #%u",
                   (int) cause, (int) esp_reset_reason(), (unsigned) id(diag_wakes));
      - script.execute: wake_cycle

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
  # A full-page draw at the per-op bounds in display_list.h can legally run
  # 20-30s (docs/plans/firmware-bounds.md D2/D3); the default 5s watchdog
  # would panic well before draw_display_list() itself ever calls back into
  # the loop task. draw_display_list() still doesn't feed the watchdog, so
  # this is the only thing between a legal slow draw and a reboot.
  watchdog_timeout: 30s

# Still needed: the panel framebuffer is 960 KB.
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  logs:
    display_list: INFO

# The fmt op's {time}: the panel's own clock at draw time. ESP-IDF keeps
# system time in the RTC across deep sleep, so after the first sync every
# hourly wake already has a valid clock and SNTP only corrects drift.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles
    # The component's own "Synchronized time" line is debug-level; say it at
    # INFO so a normal log shows whether NTP egress works.
    on_time_sync:
      - logger.log:
          level: INFO
          format: "sntp synchronized: %02d:%02d local"
          args: ["id(sntp_time).now().hour", "id(sntp_time).now().minute"]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  actions:
    - action: refresh_now
      then:
        - script.execute: wake_cycle

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # prevent covers deep_sleep's own run_duration; ota_active covers
      # sleep_now's explicit enter, which prevent does not.
      - deep_sleep.prevent: ds
      - globals.set: { id: ota_active, value: "true" }
    on_error:
      - globals.set: { id: ota_active, value: "false" }
      # prevent/allow is one shared flag, and "Stay awake" holds the same one.
      # Allowing unconditionally here would drop the board into an hour of
      # sleep with the switch still on — and deep_sleep latches a deferred
      # sleep while prevented, so it would go down on the very next loop.
      - if:
          condition:
            switch.is_off: stay_awake
          then:
            - deep_sleep.allow: ds
      # The upload blocks the main loop, so the hold has almost certainly
      # expired by now. Start it again rather than making someone re-press
      # the button and race a 30 s window an hour from now.
      - script.stop: sleep_now
      - script.execute: sleep_now

http_request:
  timeout: 15s
  watchdog_timeout: 30s
  verify_ssl: false

external_components:
  - source:
      type: git
      url: https://github.com/philippwaller/esphome-epaper-spectra6-133
      ref: v0.5.0

########################################################################
# Vocabulary — changing any of this is a rebuild
########################################################################

font:
  # Every compiled face, one `font:` entry each -- generated from
  # display_mcp.render.fonts.FONTS by `display-mcp-cli firmware-fonts`
  # (docs/plans/fonts-and-icons.md Decision 3). GF_Latin_Core stops short
  # of U+2500-U+259F (box drawing and block elements) -- exactly the
  # glyphs that turn `mono` block art into block art (docs/plans/
  # dragon-feedback.md D11's first finding) -- so every `mono` entry below
  # carries a `glyphs:` string covering that range too, generated from
  # `Face.extra_glyphs`; without it they silently vanish on the wall while
  # the preview still shows them.
  # --- fonts: generated by display-mcp-cli firmware-fonts, do not edit ---
