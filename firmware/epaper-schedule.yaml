      a.fonts["petrona-bold/28"] = id(font_petrona_bold_sm);
      a.fonts["petrona-bold/36"] = id(font_petrona_bold_md);
      a.fonts["petrona-bold/48"] = id(font_petrona_bold_lg);
      a.fonts["petrona-bold/84"] = id(font_petrona_bold_xl);
      a.fonts["petrona-italic/22"] = id(font_petrona_italic_xs);
      a.fonts["petrona-italic/28"] = id(font_petrona_italic_sm);
      a.fonts["petrona-italic/36"] = id(font_petrona_italic_md);
      a.fonts["petrona-italic/48"] = id(font_petrona_italic_lg);
      a.fonts["petrona-italic/84"] = id(font_petrona_italic_xl);
      a.fonts["instrument/22"] = id(font_instrument_xs);
      a.fonts["instrument/28"] = id(font_instrument_sm);
      a.fonts["instrument/36"] = id(font_instrument_md);
      a.fonts["instrument/48"] = id(font_instrument_lg);
      a.fonts["instrument/84"] = id(font_instrument_xl);
      a.fonts["instrument-bold/22"] = id(font_instrument_bold_xs);
      a.fonts["instrument-bold/28"] = id(font_instrument_bold_sm);
      a.fonts["instrument-bold/36"] = id(font_instrument_bold_md);
      a.fonts["instrument-bold/48"] = id(font_instrument_bold_lg);
      a.fonts["instrument-bold/84"] = id(font_instrument_bold_xl);
      a.fonts["instrument-italic/22"] = id(font_instrument_italic_xs);
      a.fonts["instrument-italic/28"] = id(font_instrument_italic_sm);
      a.fonts["instrument-italic/36"] = id(font_instrument_italic_md);
      a.fonts["instrument-italic/48"] = id(font_instrument_italic_lg);
      a.fonts["instrument-italic/84"] = id(font_instrument_italic_xl);
      a.fonts["karla/22"] = id(font_karla_xs);
      a.fonts["karla/28"] = id(font_karla_sm);
      a.fonts["karla/36"] = id(font_karla_md);
      a.fonts["karla/48"] = id(font_karla_lg);
      a.fonts["karla/84"] = id(font_karla_xl);
      a.fonts["karla-bold/22"] = id(font_karla_bold_xs);
      a.fonts["karla-bold/28"] = id(font_karla_bold_sm);
      a.fonts["karla-bold/36"] = id(font_karla_bold_md);
      a.fonts["karla-bold/48"] = id(font_karla_bold_lg);
      a.fonts["karla-bold/84"] = id(font_karla_bold_xl);
      a.fonts["karla-italic/22"] = id(font_karla_italic_xs);
      a.fonts["karla-italic/28"] = id(font_karla_italic_sm);
      a.fonts["karla-italic/36"] = id(font_karla_italic_md);
      a.fonts["karla-italic/48"] = id(font_karla_italic_lg);
      a.fonts["karla-italic/84"] = id(font_karla_italic_xl);
      a.fonts["mono/22"] = id(font_mono_xs);
      a.fonts["mono/28"] = id(font_mono_sm);
      a.fonts["mono/36"] = id(font_mono_md);
      a.fonts["mono/48"] = id(font_mono_lg);
      a.fonts["mono/84"] = id(font_mono_xl);
      a.fonts["xl"] = id(font_instrument_bold_xl);
      a.fonts["lg"] = id(font_instrument_bold_lg);
      a.fonts["md"] = id(font_instrument_md);
      a.fonts["sm"] = id(font_instrument_sm);
      a.fonts["xs"] = id(font_instrument_bold_xs);
      // --- end fonts ---

      a.icons["weather-sunny/lg"]         = id(ic_weather_sunny_lg);
      a.icons["weather-partly-cloudy/lg"] = id(ic_weather_partly_cloudy_lg);
      a.icons["weather-cloudy/lg"]        = id(ic_weather_cloudy_lg);
      a.icons["weather-rainy/lg"]         = id(ic_weather_rainy_lg);
      a.icons["weather-snowy/lg"]         = id(ic_weather_snowy_lg);
      a.icons["weather-night/lg"]         = id(ic_weather_night_lg);
      a.icons["check/sm"]                 = id(ic_check_sm);
      a.icons["map-marker/sm"]            = id(ic_map_marker_sm);
      a.icons["clock/sm"]                 = id(ic_clock_sm);
      a.icons["alert/sm"]                 = id(ic_alert_sm);
      a.icons["battery/sm"]               = id(ic_battery_sm);

      // {time} / {time24} for the fmt op; empty when the clock is not valid,
      // which the op prints as "--:--". Formatted by hand: "%-I" is a glibc
      // extension that newlib does not promise.
      auto t = id(sntp_time).now();
      if (t.is_valid()) {
        char buf[16];
        int h12 = t.hour % 12;
        if (h12 == 0) h12 = 12;
        snprintf(buf, sizeof buf, "%d:%02d %s", h12, t.minute, t.hour < 12 ? "AM" : "PM");
        a.time = buf;
        snprintf(buf, sizeof buf, "%02d:%02d", t.hour, t.minute);
        a.time24 = buf;
      }

      // {battery} / {battv}. The percentage curve lives in one place, batt_v's
      // on_value below, so the wall and the X-Panel-Battery header the server
      // records cannot disagree. The wake cycle forces a fresh ADC reading
      // before the fetch, so neither is stale.
      char bbuf[16];
      const float v = id(batt_v).state;
      if (!std::isnan(v)) {
        snprintf(bbuf, sizeof bbuf, "%.1fV", v);
        a.battv = bbuf;
      }
      const float pct = id(batt_pct).state;
      if (!std::isnan(pct)) {
        snprintf(bbuf, sizeof bbuf, "%d%%", static_cast<int>(std::lround(pct)));
        a.battery = bbuf;
      }

      if (!dl::draw_display_list(it, id(dl_body), a)) {
        // Never leave a silently blank wall. font_lg/font_sm were the
        // faces' own ids before Decision 3's generated table (docs/plans/
        // fonts-and-icons.md, B2) renamed every font: entry from its bare
        // slot name to font_<canonical name> -- "lg"/"sm" still name the
        // same two faces (instrument-bold/lg, instrument/sm) through
        // FONT_ALIASES, but this fallback draws straight off the ESPHome
        // font id, not through a.fonts, so it has to follow the rename too.
        it.print(600, 780, id(font_instrument_bold_lg), Color(255, 0, 0),
                 TextAlign::TOP_CENTER, "no display list");
        it.print(600, 850, id(font_instrument_sm), Color(0, 0, 0),
                 TextAlign::TOP_CENTER, "${dl_url}");
      }

sensor:
  - platform: adc
    id: batt_v
    pin: ${batt_adc_pin}
    name: "Battery voltage"
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 30s
    filters:
      - multiply: 3.0 # vendor BSP: volts = adc_mv * 3 / 1000
    unit_of_measurement: "V"
    device_class: voltage
    on_value:
      # The only copy of the curve. First cut: linear 3.3 V -> 0 %,
      # 4.2 V -> 100 %, clamped; a LiPo curve can replace it here and the
      # display's {battery} follows.
      - sensor.template.publish:
          id: batt_pct
          state: !lambda |-
            // NaN first, and not by way of the clamp: NaN compares false
            // against everything, so std::min(100.0f, NAN) returns 100.0f and
            // a failed ADC read would report a *full* battery — on the wall,
            // in the header, and in Home Assistant. Propagating the NaN is
            // what keeps the display's "--%" fallback and the empty header
            // reachable. adc_sensor_esp32.cpp returns NAN on a read or
            // calibration failure, and the multiply filter passes it through.
            if (std::isnan(x)) return x;
            return std::max(0.0f, std::min(100.0f, (x - 3.3f) / (4.2f - 3.3f) * 100.0f));

  # Not exported: the panel is awake for seconds an hour, so a Home Assistant
  # entity here would read "unavailable" almost always. The percentage goes to
  # the server on the next fetch instead. This exists so the curve has exactly
  # one home, shared with the display's {battery}.
  - platform: template
    id: batt_pct
    internal: true
    accuracy_decimals: 0
    # Driven by batt_v's on_value, never polled on its own.
    update_interval: never

switch:
  # Debug hold. The script's sleep_now checks this, but deep_sleep's own
  # run_duration would still put the board down after ${max_awake}, so the
  # switch has to tell the component too. Persisted across reboots: turn it
  # off again or the panel never sleeps.
  - platform: template
    id: stay_awake
    name: "Stay awake"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - deep_sleep.prevent: ds
    on_turn_off:
      - deep_sleep.allow: ds

deep_sleep:
  id: ds
  run_duration: ${max_awake}
  sleep_duration: ${sleep_minutes}
  wakeup_pin:
    number: ${boot_button_pin}
    inverted: true
    allow_other_uses: true # also the boot_button binary_sensor below
  wakeup_pin_mode: KEEP_AWAKE

# While awake (e.g. "Stay awake" held), the boot button refetches. Asleep, the
# same GPIO is the deep-sleep wakeup pin above, and the boot-time wake_cycle
# does the fetch. wake_cycle is mode: single, so a press mid-fetch is ignored.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: ${boot_button_pin}
      inverted: true
      mode: { input: true, pullup: true }
      allow_other_uses: true
    filters:
      - delayed_on: 30ms
    on_press:
      # Also fires on the press that woke the board, which on_boot has already
      # accounted for; setting it twice is free.
      - globals.set: { id: woke_by_button, value: "true" }
      - script.execute: wake_cycle

########################################################################
# Wake cycle
#
# The 30 s panel refresh is the expensive part — about 1.5 mAh against the
# 0.15 mAh of a wake that changes nothing. So we ask with If-None-Match and
# hope for a 304: no body, no parse, no refresh. On a 200 we compare
# meta.hash as well, which catches a server whose ETag moves when the
# content doesn't.
########################################################################

script:
  - id: wake_cycle
    mode: single
    then:
      # sleep_now may be part-way through its OTA hold from the previous
      # cycle. It is mode: single, so the script.execute at the end of THIS
      # cycle would be dropped and the old hold would expire mid-refresh and
      # force a sleep. Cancel it up front; this cycle owns the sleep now.
      - script.stop: sleep_now
      - lambda: |-
          id(diag_status) = 0;
          id(diag_result) = "no response";
          // Not restored across boots, but a held-awake board runs many
          // cycles: without this a 304 after an earlier 200 still holds last
          // cycle's body and logs "the server sent 200".
          id(dl_body).clear();
          id(dl_new_id).clear();
      # The ADC's own poll lands at a random offset inside its interval, so
      # force one before the fetch: the battery headers below and the draw's
      # {battery} both read it, and neither wants an hour-old value.
      - component.update: batt_v
      - wait_until:
          condition:
            wifi.connected:
          timeout: 20s
      - http_request.get:
          url: ${dl_url}
          capture_response: true
          # ESPHome caps captured bodies at 1 kB by default and silently
          # truncates; a display list is a few KB, so raise it to exactly
          # the server's own hard limit on a document (store.MAX_DOC_BYTES;
          # docs/plans/firmware-bounds.md D9) -- tests/parity/
          # test_limits_and_dispatch.py asserts the two numbers match.
          # Spelled as a byte count, not "64kB": ESPHome's validate_bytes
          # treats metric suffixes decimally (k = 1000, from
          # config_validation.py's METRIC_SUFFIXES), so "64kB" parses as
          # 64000 -- 1536 bytes short of MAX_DOC_BYTES (64 * 1024), enough
          # to silently truncate a document right at the ceiling.
          max_response_buffer_size: 65536B
          # Empty on first boot, which simply means "no match" and gets a 200.
          #
          # The X-Panel-* headers are the panel's half of the diagnostics: the
          # server already logs when it was asked, what it answered and from
          # where, so these carry only what it cannot see. They describe the
          # wake as it starts, so Last-Draw is the *previous* draw — which is
          # the useful reading: a 200 served last hour with this header
          # unchanged means the panel fetched fine and failed to draw.
          # Each needs its own static: the value has to outlive the lambda.
          request_headers:
            If-None-Match: !lambda |-
              // Header values are const char*; keep the storage alive for
              // the request rather than pointing into a temporary.
              static std::string hdr;
              hdr = id(dl_shown_id).empty() ? "" : "\"" + id(dl_shown_id) + "\"";
              return hdr.c_str();
            X-Panel-Wakes: !lambda |-
              static std::string hdr;
              hdr = std::to_string(id(diag_wakes));
              return hdr.c_str();
            X-Panel-Last-Draw: !lambda |-
              // Empty until the panel has drawn once with a valid clock.
              static std::string hdr;
              hdr = id(diag_draw_ts);
              return hdr.c_str();
            X-Panel-Battery: !lambda |-
              static std::string hdr;
              const float pct = id(batt_pct).state;
              hdr = std::isnan(pct) ? "" : std::to_string(static_cast<int>(std::lround(pct)));
              return hdr.c_str();
            X-Panel-Volts: !lambda |-
              // The raw reading as well as the percentage, so a wrong curve
              // is diagnosable from the server without reflashing.
              static std::string hdr;
              const float v = id(batt_v).state;
              if (std::isnan(v)) {
                hdr.clear();
              } else {
                char buf[16];
                snprintf(buf, sizeof buf, "%.2f", v);
                hdr = buf;
              }
              return hdr.c_str();
          on_response:
            then:
              - lambda: |-
                  // A 304 has no body, so dl_body stays empty and the guard
                  // below skips the refresh. ESPHome logs its own ERROR line
                  // for any non-2xx: on an unchanged wake that is cosmetic.
                  id(diag_status) = response->status_code;
                  if (response->status_code == 304) {
                    id(diag_result) = "304 not modified";
                    ESP_LOGI("dl", "304 not modified");
                    return;
                  }
                  if (response->status_code != 200) {
                    char buf[24];
                    snprintf(buf, sizeof buf, "HTTP %d", response->status_code);
                    id(diag_result) = buf;
                    ESP_LOGW("dl", "HTTP %d", response->status_code);
                    return;
                  }
                  // Overwritten by the redraw/unchanged branches below; it
                  // stands only for a 200 whose body was empty or unusable,
                  // which would otherwise be logged as "no response".
                  id(diag_result) = "200 received";
                  // document_id() reads `body` before it's moved from --
                  // order matters here (docs/plans/firmware-bounds.md D9):
                  // the trigger hands this lambda a mutable `std::string &`,
                  // so moving it into dl_body leaves the body in internal
                  // SRAM exactly once instead of copied into a second
                  // std::string first.
                  id(dl_new_id) = dl::document_id(body);
                  id(dl_body) = std::move(body);
                  if (id(dl_new_id).empty()) {
                    ESP_LOGE("dl", "BUG: document has no meta.hash. Every wake will "
                                   "now do a full 30 s refresh — about 36 mAh/day, "
                                   "which roughly halves battery life. Fix the "
                                   "generator: display-mcp-cli stamp display.json");
                  }
                  // body was moved from above; dl_body is the same bytes now.
                  ESP_LOGI("dl", "%u bytes, id '%s' (shown '%s')",
                           (unsigned) id(dl_body).size(), id(dl_new_id).c_str(),
                           id(dl_shown_id).c_str());
          on_error:
            # No response at all: DNS, routing, a server that is not up. Without
            # this the wake would report whatever the last one did.
            then:
              - lambda: |-
                  id(diag_result) = "fetch failed";
                  ESP_LOGW("dl", "fetch failed: no response from ${dl_url}");
      - if:
          condition:
            lambda: |-
              // An unknown id means we cannot tell whether anything changed, so
              // we redraw. That is the expensive path, and the ERROR above says so.
              if (id(dl_body).empty()) return false;
              return id(dl_new_id).empty() || id(dl_new_id) != id(dl_shown_id);
          then:
            # Only on the redraw path, never on a 304: give SNTP a moment so
            # the {time} stamp, and the draw stamp below, are real. A cold
            # boot that misses it prints --:--.
            - wait_until:
                condition:
                  time.has_time:
                timeout: 5s
            # The stamp at the end is what turns every later fetch into a
            # 304, so it must follow a refresh that demonstrably ran. On
            # 2026-09-19 the display component had failed setup,
            # component.update was skipped silently (UpdateComponentAction
            # returns when the component is not ready), the wait returned at
            # once, and the new hash was stamped as shown with the old image
            # still on the glass: 304 forever (docs/plans/wake-sleep-flow.md).
            # Every failure path here keeps the old shown id so the next wake
            # gets a 200 and tries again.
            - if:
                condition:
                  lambda: "return id(epd).is_failed();"
                then:
                  - lambda: |-
                      id(diag_result) = "200 display failed";
                      ESP_LOGE("dl", "display component failed setup; not drawing, "
                                     "shown id kept");
                else:
                  - component.update: epd
                  # update() schedules synchronously, so this is normally
                  # already true; the short wait only guards a driver that
                  # defers. It stays false when the update was skipped or the
                  # driver refused the operation.
                  - wait_until:
                      condition:
                        lambda: "return id(epd).is_processing();"
                      timeout: 2s
                  - lambda: "id(draw_started) = id(epd).is_processing();"
                  - if:
                      condition:
                        lambda: "return id(draw_started);"
                      then:
                        - wait_until:
                            condition:
                              lambda: "return !id(epd).is_processing();"
                            timeout: 180s
                        - delay: 3s
                        - if:
                            condition:
                              lambda: "return !id(epd).is_processing();"
                            then:
                              - lambda: |-
                                  id(dl_shown_id) = id(dl_new_id);
                                  id(diag_result) = "200 redrawn";
                                  auto t = id(sntp_time).utcnow();
                                  if (t.is_valid()) id(diag_draw_ts) = t.strftime("%Y-%m-%dT%H:%M:%SZ");
                                  ESP_LOGI("dl", "redrawn; shown id now '%s'", id(dl_shown_id).c_str());
                            else:
                              - lambda: |-
                                  id(diag_result) = "200 draw did not finish";
                                  ESP_LOGE("dl", "refresh still running after 180 s; shown id kept");
                      else:
                        - lambda: |-
                            id(diag_result) = "200 draw did not run";
                            ESP_LOGE("dl", "component.update did nothing (display not ready, "
                                           "or the driver refused the operation); shown id kept");
          else:
            # Say which guard stopped the refresh. A 304 means the ETag did its
            # job. A 200 with identical bytes means the server's ETag changed
            # while the content did not — mtime-derived, not content-derived —
            # and only the hash saved you a 30 s refresh. Worth fixing at the
            # source: see "Server-side ETag" in SPEC.md.
            - lambda: |-
                if (!id(dl_body).empty()) {
                  id(diag_result) = "200 unchanged";
                  ESP_LOGW("dl", "unchanged, but the server sent 200 — its ETag "
                                 "does not match meta.hash; meta.hash caught it");
                } else if (id(diag_status) == 304) {
                  ESP_LOGI("dl", "unchanged (304) — no download, no refresh");
                } else {
                  // Not a quiet wake at all: no usable document this hour, and
                  // the wall is still showing the last one that worked.
                  ESP_LOGW("dl", "nothing drawn: %s", id(diag_result).c_str());
                }
      - script.execute: sleep_now

  - id: sleep_now
    mode: single
    then:
      - if:
          condition:
            switch.is_on: stay_awake
          then:
            - logger.log:
                level: INFO
                format: "held awake"
          else:
            # A wake somebody asked for gets a window to be flashed in; the
            # hourly ones go straight back down and cost nothing. On a redraw
            # this is 30 s on top of an already long wake, which is fine — it
            # is a deliberate press either way, and a rule with no exceptions
            # beats one that saves half a milliamp-hour a month.
            - if:
                condition:
                  lambda: "return id(woke_by_button);"
                then:
                  - logger.log:
                      level: INFO
                      format: "woken by button — holding ${flash_window} for OTA"
                  - delay: ${flash_window}
            # deep_sleep.enter below is forced, so it would happily sleep in
            # the middle of an upload that started inside the window.
            - wait_until:
                condition:
                  lambda: "return !id(ota_active);"
                timeout: 5min
            - deep_sleep.enter: ds

button:
  - platform: template
    name: "Fetch and draw"
    on_press:
      - script.execute: wake_cycle

  - platform: template
    name: "Force redraw"
    on_press:
      - lambda: "id(dl_shown_id).clear();"
      - script.execute: wake_cycle
