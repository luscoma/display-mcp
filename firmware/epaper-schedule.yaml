########################################################################
# Waveshare ESP32-S3-ePaper-13.3E6 — display-list build
#
# The firmware is a renderer, not a design. It fetches a few KB of JSON,
# executes it against the panel, and sleeps. Changing the layout is a file
# edit on the server; only the vocabulary below (five font sizes, eleven
# icons, the op set in display_list.h) is compiled in.
#
# No online_image, so no 3.84 MB PSRAM decode buffer.
#
# Source of truth: display-mcp/firmware/. display_list.h and secrets.yaml
# (gitignored) sit next to this file; build with `esphome run` from here.
########################################################################

substitutions:
  device_name: epaper-13e6
  friendly_name: E-Paper Schedule

  # The display-list server. Raw IP on purpose: the panel's DNS view has
  # already changed under it once, and a dead name leaves the wall frozen on
  # its last image with nothing in the log but a failed fetch.
  dl_url: "http://172.17.247.125:8080/display.json"

  sleep_minutes: "60min"
  max_awake: "4min"

  # How long a wake lingers before deep sleep so an OTA can get its
  # connection in — but only on a wake the boot button caused, never on the
  # hourly timer. Pressing the button is already the "I am standing at the
  # panel and I want it" signal; a window on every wake would be ~0.8 mAh of
  # idle radio an hour, about 20 mAh/day, to be ready for something that
  # happens twice a month. This way it is free until it is wanted, which is
  # what lets it be generous.
  flash_window: "30s"

  epd_clk_pin: "9"
  epd_data0_pin: "46"
  epd_data1_pin: "17" # no MISO on this board; inert spare pin
  epd_cs0_pin: "10"
  epd_cs1_pin: "3"
  epd_reset_pin: "2"
  epd_busy_pin: "12"
  epd_power_pin: "1"
  batt_adc_pin: "8"
  boot_button_pin: "0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - display_list.h
  on_boot:
    priority: -100
    then:
      # Why this wake happened, which is the whole basis for holding the board
      # open afterwards (see flash_window). esp_sleep.h comes in with
      # deep_sleep's own header. A cold boot reports UNDEFINED and is
      # deliberately NOT treated as a press: a brownout loop on a flat battery
      # would then hold 30 s every time it restarted, which is exactly when
      # the panel can least afford it. Press the button after a power-on.
      - lambda: |-
          const auto cause = esp_sleep_get_wakeup_cause();
          id(woke_by_button) = cause == ESP_SLEEP_WAKEUP_EXT0 ||
                               cause == ESP_SLEEP_WAKEUP_EXT1 ||
                               cause == ESP_SLEEP_WAKEUP_GPIO;
          // Counted here and not in wake_cycle, which also runs from the
          // refresh_now action and both template buttons: X-Panel-Wakes is
          // meant to be comparable against the hourly schedule, so a manual
          // refresh must not look like an extra wake.
          id(diag_wakes) += 1;
      - script.execute: wake_cycle

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# Still needed: the panel framebuffer is 960 KB.
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  logs:
    display_list: INFO

# The fmt op's {time}: the panel's own clock at draw time. ESP-IDF keeps
# system time in the RTC across deep sleep, so after the first sync every
# hourly wake already has a valid clock and SNTP only corrects drift.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles
    # The component's own "Synchronized time" line is debug-level; say it at
    # INFO so a normal log shows whether NTP egress works.
    on_time_sync:
      - logger.log:
          level: INFO
          format: "sntp synchronized: %02d:%02d local"
          args: ["id(sntp_time).now().hour", "id(sntp_time).now().minute"]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  actions:
    - action: refresh_now
      then:
        - script.execute: wake_cycle

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # prevent covers deep_sleep's own run_duration; ota_active covers
      # sleep_now's explicit enter, which prevent does not.
      - deep_sleep.prevent: ds
      - globals.set: { id: ota_active, value: "true" }
    on_error:
      - globals.set: { id: ota_active, value: "false" }
      # prevent/allow is one shared flag, and "Stay awake" holds the same one.
      # Allowing unconditionally here would drop the board into an hour of
      # sleep with the switch still on — and deep_sleep latches a deferred
      # sleep while prevented, so it would go down on the very next loop.
      - if:
          condition:
            switch.is_off: stay_awake
          then:
            - deep_sleep.allow: ds
      # The upload blocks the main loop, so the hold has almost certainly
      # expired by now. Start it again rather than making someone re-press
      # the button and race a 30 s window an hour from now.
      - script.stop: sleep_now
      - script.execute: sleep_now

http_request:
  timeout: 15s
  watchdog_timeout: 30s
  verify_ssl: false

external_components:
  - source:
      type: git
      url: https://github.com/philippwaller/esphome-epaper-spectra6-133
      ref: v0.5.0

########################################################################
# Vocabulary — changing any of this is a rebuild
########################################################################

font:
  - file: &face { type: gfonts, family: Instrument Sans, weight: 700 }
    id: font_xl
    size: 84
    glyphsets: [GF_Latin_Core]
  - file: *face
    id: font_lg
    size: 48
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Instrument Sans, weight: 400 }
    id: font_md
    size: 36
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Instrument Sans, weight: 400 }
    id: font_sm
    size: 28
    glyphsets: [GF_Latin_Core]
  - file: *face
    id: font_xs
    size: 22
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: JetBrains Mono, weight: 400 }
    id: font_mono
    size: 24
    glyphsets: [GF_Latin_Core]
    # GF_Latin_Core stops short of U+2500-U+259F (box drawing and block
    # elements) -- exactly the glyphs that turn `mono` block art into block
    # art (docs/plans/dragon-feedback.md D11's first finding). Without this,
    # they silently vanish on the wall while the preview still shows them.
    # Generated: chr(c) for c in range(0x2500, 0x25A0).
    glyphs: "─━│┃┄┅┆┇┈┉┊┋┌┍┎┏┐┑┒┓└┕┖┗┘┙┚┛├┝┞┟┠┡┢┣┤┥┦┧┨┩┪┫┬┭┮┯┰┱┲┳┴┵┶┷┸┹┺┻┼┽┾┿╀╁╂╃╄╅╆╇╈╉╊╋╌╍╎╏═║╒╓╔╕╖╗╘╙╚╛╜╝╞╟╠╡╢╣╤╥╦╧╨╩╪╫╬╭╮╯╰╱╲╳╴╵╶╷╸╹╺╻╼╽╾╿▀▁▂▃▄▅▆▇█▉▊▋▌▍▎▏▐░▒▓▔▕▖▗▘▙▚▛▜▝▞▟"

# Icons come from Material Design Icons by NAME, so there are no codepoints
# to get wrong. chroma_key keeps the off pixels transparent, which matters
# wherever an icon sits on a coloured fill.
image:
  - { file: mdi:weather-sunny,         id: ic_weather_sunny_lg,         type: BINARY, transparency: chroma_key, resize: 88x88 }
  - { file: mdi:weather-partly-cloudy, id: ic_weather_partly_cloudy_lg, type: BINARY, transparency: chroma_key, resize: 88x88 }
  - { file: mdi:weather-cloudy,        id: ic_weather_cloudy_lg,        type: BINARY, transparency: chroma_key, resize: 88x88 }
  - { file: mdi:weather-rainy,         id: ic_weather_rainy_lg,         type: BINARY, transparency: chroma_key, resize: 88x88 }
  - { file: mdi:weather-snowy,         id: ic_weather_snowy_lg,         type: BINARY, transparency: chroma_key, resize: 88x88 }
  - { file: mdi:weather-night,         id: ic_weather_night_lg,         type: BINARY, transparency: chroma_key, resize: 88x88 }
  - { file: mdi:check,                 id: ic_check_sm,                 type: BINARY, transparency: chroma_key, resize: 36x36 }
  - { file: mdi:map-marker,            id: ic_map_marker_sm,            type: BINARY, transparency: chroma_key, resize: 36x36 }
  - { file: mdi:clock-outline,         id: ic_clock_sm,                 type: BINARY, transparency: chroma_key, resize: 36x36 }
  - { file: mdi:alert,                 id: ic_alert_sm,                 type: BINARY, transparency: chroma_key, resize: 36x36 }
  - { file: mdi:battery,               id: ic_battery_sm,               type: BINARY, transparency: chroma_key, resize: 36x36 }

########################################################################
# State
########################################################################

globals:
  # The fetched document. Not restored — every wake is a cold boot.
  - id: dl_body
    type: std::string
    restore_value: false
  # Identity of what is currently ON the panel — the document's meta.hash.
  # One value does both jobs: it is sent as If-None-Match so the server can
  # 304 us, and compared locally so a changed timestamp never costs a refresh.
  # Restored strings are a real ESPHome thing (RestoringGlobalStringComponent).
  - id: dl_shown_id
    type: std::string
    restore_value: true
    max_restore_data_length: 64
  - id: dl_new_id
    type: std::string
    restore_value: false

  # The two things the server cannot see for itself. It already records when
  # the panel asked, what it answered and from which address, so the only
  # news the panel has is its battery, whether the last fetch actually
  # reached the glass, and how many times it has woken. They ride the next
  # fetch as request headers. Persisted because every wake is a cold boot.
  - id: diag_draw_ts
    type: std::string
    restore_value: true
    max_restore_data_length: 32
  - id: diag_wakes
    type: uint32_t
    restore_value: true
    initial_value: "0"

  # Log-only, within one wake: what the fetch did, so the line at the end of
  # the cycle can say so instead of guessing from an empty body.
  - id: diag_status
    type: int
    restore_value: false
    initial_value: "0"
  - id: diag_result
    type: std::string
    restore_value: false

  # deep_sleep.enter is a *forced* sleep — it ignores deep_sleep.prevent — so
  # sleep_now has to know about an OTA itself or it will cut one off.
  - id: ota_active
    type: bool
    restore_value: false
    initial_value: "false"

  # Set from the wakeup cause at boot, and by the button itself when it is
  # pressed on a board that is already up. Never cleared inside wake_cycle:
  # one press should still be honoured if a second cycle runs before sleep.
  - id: woke_by_button
    type: bool
    restore_value: false
    initial_value: "false"

########################################################################
# Display
########################################################################

display:
  - platform: epaper_spectra6_133
    id: epd
    spi_host: SPI3_HOST
    update_interval: never
    clk_pin: ${epd_clk_pin}
    data0_pin: ${epd_data0_pin}
    data1_pin: ${epd_data1_pin}
    cs0_pin: ${epd_cs0_pin}
    cs1_pin: ${epd_cs1_pin}
    busy_pin: ${epd_busy_pin}
    reset_pin: ${epd_reset_pin}
    power_pin: ${epd_power_pin}
    clear_color: white
    change_detection_mode: track
    auto_sleep: true
    power_off_after_sleep: true
    lambda: |-
      dl::DisplayListAssets a;
      a.fonts["xl"] = id(font_xl);
      a.fonts["lg"] = id(font_lg);
      a.fonts["md"] = id(font_md);
      a.fonts["sm"] = id(font_sm);
      a.fonts["xs"] = id(font_xs);
      a.fonts["mono"] = id(font_mono);

      a.icons["weather-sunny/lg"]         = id(ic_weather_sunny_lg);
      a.icons["weather-partly-cloudy/lg"] = id(ic_weather_partly_cloudy_lg);
      a.icons["weather-cloudy/lg"]        = id(ic_weather_cloudy_lg);
      a.icons["weather-rainy/lg"]         = id(ic_weather_rainy_lg);
      a.icons["weather-snowy/lg"]         = id(ic_weather_snowy_lg);
      a.icons["weather-night/lg"]         = id(ic_weather_night_lg);
      a.icons["check/sm"]                 = id(ic_check_sm);
      a.icons["map-marker/sm"]            = id(ic_map_marker_sm);
      a.icons["clock/sm"]                 = id(ic_clock_sm);
      a.icons["alert/sm"]                 = id(ic_alert_sm);
      a.icons["battery/sm"]               = id(ic_battery_sm);

      // {time} / {time24} for the fmt op; empty when the clock is not valid,
      // which the op prints as "--:--". Formatted by hand: "%-I" is a glibc
      // extension that newlib does not promise.
      auto t = id(sntp_time).now();
      if (t.is_valid()) {
        char buf[16];
        int h12 = t.hour % 12;
        if (h12 == 0) h12 = 12;
        snprintf(buf, sizeof buf, "%d:%02d %s", h12, t.minute, t.hour < 12 ? "AM" : "PM");
        a.time = buf;
        snprintf(buf, sizeof buf, "%02d:%02d", t.hour, t.minute);
        a.time24 = buf;
      }

      // {battery} / {battv}. The percentage curve lives in one place, batt_v's
      // on_value below, so the wall and the X-Panel-Battery header the server
      // records cannot disagree. The wake cycle forces a fresh ADC reading
      // before the fetch, so neither is stale.
      char bbuf[16];
      const float v = id(batt_v).state;
      if (!std::isnan(v)) {
        snprintf(bbuf, sizeof bbuf, "%.1fV", v);
        a.battv = bbuf;
      }
      const float pct = id(batt_pct).state;
      if (!std::isnan(pct)) {
        snprintf(bbuf, sizeof bbuf, "%d%%", static_cast<int>(std::lround(pct)));
        a.battery = bbuf;
      }

      if (!dl::draw_display_list(it, id(dl_body), a)) {
        // Never leave a silently blank wall.
        it.print(600, 780, id(font_lg), Color(255, 0, 0),
                 TextAlign::TOP_CENTER, "no display list");
        it.print(600, 850, id(font_sm), Color(0, 0, 0),
                 TextAlign::TOP_CENTER, "${dl_url}");
      }

sensor:
  - platform: adc
    id: batt_v
    pin: ${batt_adc_pin}
    name: "Battery voltage"
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 30s
    filters:
      - multiply: 3.0 # vendor BSP: volts = adc_mv * 3 / 1000
    unit_of_measurement: "V"
    device_class: voltage
    on_value:
      # The only copy of the curve. First cut: linear 3.3 V -> 0 %,
      # 4.2 V -> 100 %, clamped; a LiPo curve can replace it here and the
      # display's {battery} follows.
      - sensor.template.publish:
          id: batt_pct
          state: !lambda |-
            // NaN first, and not by way of the clamp: NaN compares false
            // against everything, so std::min(100.0f, NAN) returns 100.0f and
            // a failed ADC read would report a *full* battery — on the wall,
            // in the header, and in Home Assistant. Propagating the NaN is
            // what keeps the display's "--%" fallback and the empty header
            // reachable. adc_sensor_esp32.cpp returns NAN on a read or
            // calibration failure, and the multiply filter passes it through.
            if (std::isnan(x)) return x;
            return std::max(0.0f, std::min(100.0f, (x - 3.3f) / (4.2f - 3.3f) * 100.0f));

  # Not exported: the panel is awake for seconds an hour, so a Home Assistant
  # entity here would read "unavailable" almost always. The percentage goes to
  # the server on the next fetch instead. This exists so the curve has exactly
  # one home, shared with the display's {battery}.
  - platform: template
    id: batt_pct
    internal: true
    accuracy_decimals: 0
    # Driven by batt_v's on_value, never polled on its own.
    update_interval: never

switch:
  # Debug hold. The script's sleep_now checks this, but deep_sleep's own
  # run_duration would still put the board down after ${max_awake}, so the
  # switch has to tell the component too. Persisted across reboots: turn it
  # off again or the panel never sleeps.
  - platform: template
    id: stay_awake
    name: "Stay awake"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - deep_sleep.prevent: ds
    on_turn_off:
      - deep_sleep.allow: ds

deep_sleep:
  id: ds
  run_duration: ${max_awake}
  sleep_duration: ${sleep_minutes}
  wakeup_pin:
    number: ${boot_button_pin}
    inverted: true
    allow_other_uses: true # also the boot_button binary_sensor below
  wakeup_pin_mode: KEEP_AWAKE

# While awake (e.g. "Stay awake" held), the boot button refetches. Asleep, the
# same GPIO is the deep-sleep wakeup pin above, and the boot-time wake_cycle
# does the fetch. wake_cycle is mode: single, so a press mid-fetch is ignored.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: ${boot_button_pin}
      inverted: true
      mode: { input: true, pullup: true }
      allow_other_uses: true
    filters:
      - delayed_on: 30ms
    on_press:
      # Also fires on the press that woke the board, which on_boot has already
      # accounted for; setting it twice is free.
      - globals.set: { id: woke_by_button, value: "true" }
      - script.execute: wake_cycle

########################################################################
# Wake cycle
#
# The 30 s panel refresh is the expensive part — about 1.5 mAh against the
# 0.15 mAh of a wake that changes nothing. So we ask with If-None-Match and
# hope for a 304: no body, no parse, no refresh. On a 200 we compare
# meta.hash as well, which catches a server whose ETag moves when the
# content doesn't.
########################################################################

script:
  - id: wake_cycle
    mode: single
    then:
      # sleep_now may be part-way through its OTA hold from the previous
      # cycle. It is mode: single, so the script.execute at the end of THIS
      # cycle would be dropped and the old hold would expire mid-refresh and
      # force a sleep. Cancel it up front; this cycle owns the sleep now.
      - script.stop: sleep_now
      - lambda: |-
          id(diag_status) = 0;
          id(diag_result) = "no response";
      # The ADC's own poll lands at a random offset inside its interval, so
      # force one before the fetch: the battery headers below and the draw's
      # {battery} both read it, and neither wants an hour-old value.
      - component.update: batt_v
      - wait_until:
          condition:
            wifi.connected:
          timeout: 20s
      - http_request.get:
          url: ${dl_url}
          capture_response: true
          # ESPHome caps captured bodies at 1 kB by default and silently
          # truncates; a display list is a few KB, so raise it well past
          # the server's 256 KB hard limit on a document.
          max_response_buffer_size: 256kB
          # Empty on first boot, which simply means "no match" and gets a 200.
          #
          # The X-Panel-* headers are the panel's half of the diagnostics: the
          # server already logs when it was asked, what it answered and from
          # where, so these carry only what it cannot see. They describe the
          # wake as it starts, so Last-Draw is the *previous* draw — which is
          # the useful reading: a 200 served last hour with this header
          # unchanged means the panel fetched fine and failed to draw.
          # Each needs its own static: the value has to outlive the lambda.
          request_headers:
            If-None-Match: !lambda |-
              // Header values are const char*; keep the storage alive for
              // the request rather than pointing into a temporary.
              static std::string hdr;
              hdr = id(dl_shown_id).empty() ? "" : "\"" + id(dl_shown_id) + "\"";
              return hdr.c_str();
            X-Panel-Wakes: !lambda |-
              static std::string hdr;
              hdr = std::to_string(id(diag_wakes));
              return hdr.c_str();
            X-Panel-Last-Draw: !lambda |-
              // Empty until the panel has drawn once with a valid clock.
              static std::string hdr;
              hdr = id(diag_draw_ts);
              return hdr.c_str();
            X-Panel-Battery: !lambda |-
              static std::string hdr;
              const float pct = id(batt_pct).state;
              hdr = std::isnan(pct) ? "" : std::to_string(static_cast<int>(std::lround(pct)));
              return hdr.c_str();
            X-Panel-Volts: !lambda |-
              // The raw reading as well as the percentage, so a wrong curve
              // is diagnosable from the server without reflashing.
              static std::string hdr;
              const float v = id(batt_v).state;
              if (std::isnan(v)) {
                hdr.clear();
              } else {
                char buf[16];
                snprintf(buf, sizeof buf, "%.2f", v);
                hdr = buf;
              }
              return hdr.c_str();
          on_response:
            then:
              - lambda: |-
                  // A 304 has no body, so dl_body stays empty and the guard
                  // below skips the refresh. ESPHome logs its own ERROR line
                  // for any non-2xx: on an unchanged wake that is cosmetic.
                  id(diag_status) = response->status_code;
                  if (response->status_code == 304) {
                    id(diag_result) = "304 not modified";
                    ESP_LOGI("dl", "304 not modified");
                    return;
                  }
                  if (response->status_code != 200) {
                    char buf[24];
                    snprintf(buf, sizeof buf, "HTTP %d", response->status_code);
                    id(diag_result) = buf;
                    ESP_LOGW("dl", "HTTP %d", response->status_code);
                    return;
                  }
                  // Overwritten by the redraw/unchanged branches below; it
                  // stands only for a 200 whose body was empty or unusable,
                  // which would otherwise be logged as "no response".
                  id(diag_result) = "200 received";
                  id(dl_body) = body;
                  id(dl_new_id) = dl::document_id(body);
                  if (id(dl_new_id).empty()) {
                    ESP_LOGE("dl", "BUG: document has no meta.hash. Every wake will "
                                   "now do a full 30 s refresh — about 36 mAh/day, "
                                   "which roughly halves battery life. Fix the "
                                   "generator: display-mcp-cli stamp display.json");
                  }
                  ESP_LOGI("dl", "%u bytes, id '%s' (shown '%s')",
                           (unsigned) body.size(), id(dl_new_id).c_str(),
                           id(dl_shown_id).c_str());
          on_error:
            # No response at all: DNS, routing, a server that is not up. Without
            # this the wake would report whatever the last one did.
            then:
              - lambda: |-
                  id(diag_result) = "fetch failed";
                  ESP_LOGW("dl", "fetch failed: no response from ${dl_url}");
      - if:
          condition:
            lambda: |-
              // An unknown id means we cannot tell whether anything changed, so
              // we redraw. That is the expensive path, and the ERROR above says so.
              if (id(dl_body).empty()) return false;
              return id(dl_new_id).empty() || id(dl_new_id) != id(dl_shown_id);
          then:
            # Only on the redraw path, never on a 304: give SNTP a moment so
            # the {time} stamp, and the draw stamp below, are real. A cold
            # boot that misses it prints --:--.
            - wait_until:
                condition:
                  time.has_time:
                timeout: 5s
            - component.update: epd
            - wait_until:
                condition:
                  lambda: "return !id(epd).is_processing();"
                timeout: 180s
            - delay: 3s
            - lambda: |-
                id(dl_shown_id) = id(dl_new_id);
                id(diag_result) = "200 redrawn";
                auto t = id(sntp_time).utcnow();
                if (t.is_valid()) id(diag_draw_ts) = t.strftime("%Y-%m-%dT%H:%M:%SZ");
          else:
            # Say which guard stopped the refresh. A 304 means the ETag did its
            # job. A 200 with identical bytes means the server's ETag changed
            # while the content did not — mtime-derived, not content-derived —
            # and only the hash saved you a 30 s refresh. Worth fixing at the
            # source: see "Server-side ETag" in SPEC.md.
            - lambda: |-
                if (!id(dl_body).empty()) {
                  id(diag_result) = "200 unchanged";
                  ESP_LOGW("dl", "unchanged, but the server sent 200 — its ETag "
                                 "does not match meta.hash; meta.hash caught it");
                } else if (id(diag_status) == 304) {
                  ESP_LOGI("dl", "unchanged (304) — no download, no refresh");
                } else {
                  // Not a quiet wake at all: no usable document this hour, and
                  // the wall is still showing the last one that worked.
                  ESP_LOGW("dl", "nothing drawn: %s", id(diag_result).c_str());
                }
      - script.execute: sleep_now

  - id: sleep_now
    mode: single
    then:
      - if:
          condition:
            switch.is_on: stay_awake
          then:
            - logger.log: "held awake"
          else:
            # A wake somebody asked for gets a window to be flashed in; the
            # hourly ones go straight back down and cost nothing. On a redraw
            # this is 30 s on top of an already long wake, which is fine — it
            # is a deliberate press either way, and a rule with no exceptions
            # beats one that saves half a milliamp-hour a month.
            - if:
                condition:
                  lambda: "return id(woke_by_button);"
                then:
                  - logger.log: "woken by button — holding ${flash_window} for OTA"
                  - delay: ${flash_window}
            # deep_sleep.enter below is forced, so it would happily sleep in
            # the middle of an upload that started inside the window.
            - wait_until:
                condition:
                  lambda: "return !id(ota_active);"
                timeout: 5min
            - deep_sleep.enter: ds

button:
  - platform: template
    name: "Fetch and draw"
    on_press:
      - script.execute: wake_cycle

  - platform: template
    name: "Force redraw"
    on_press:
      - lambda: "id(dl_shown_id).clear();"
      - script.execute: wake_cycle
