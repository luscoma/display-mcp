########################################################################
# State
########################################################################

globals:
  # The fetched document. Not restored — every wake is a cold boot.
  - id: dl_body
    type: std::string
    restore_value: false
  # Identity of what is currently ON the panel — the document's meta.hash.
  # One value does both jobs: it is sent as If-None-Match so the server can
  # 304 us, and compared locally so a changed timestamp never costs a refresh.
  # Restored strings are a real ESPHome thing (RestoringGlobalStringComponent).
  - id: dl_shown_id
    type: std::string
    restore_value: true
    max_restore_data_length: 64
  - id: dl_new_id
    type: std::string
    restore_value: false

  # The two things the server cannot see for itself. It already records when
  # the panel asked, what it answered and from which address, so the only
  # news the panel has is its battery, whether the last fetch actually
  # reached the glass, and how many times it has woken. They ride the next
  # fetch as request headers. Persisted because every wake is a cold boot.
  - id: diag_draw_ts
    type: std::string
    restore_value: true
    max_restore_data_length: 32
  - id: diag_wakes
    type: uint32_t
    restore_value: true
    initial_value: "0"

  # Log-only, within one wake: what the fetch did, so the line at the end of
  # the cycle can say so instead of guessing from an empty body.
  - id: diag_status
    type: int
    restore_value: false
    initial_value: "0"
  - id: diag_result
    type: std::string
    restore_value: false

  # deep_sleep.enter is a *forced* sleep — it ignores deep_sleep.prevent — so
  # sleep_now has to know about an OTA itself or it will cut one off.
  - id: ota_active
    type: bool
    restore_value: false
    initial_value: "false"

  # Set from the wakeup cause at boot, and by the button itself when it is
  # pressed on a board that is already up. Never cleared inside wake_cycle:
  # one press should still be honoured if a second cycle runs before sleep.
  - id: woke_by_button
    type: bool
    restore_value: false
    initial_value: "false"

  # Whether component.update actually started a display operation this
  # cycle. It gates the shown-id stamp in wake_cycle.
  - id: draw_started
    type: bool
    restore_value: false
    initial_value: "false"

########################################################################
# Display
########################################################################

display:
  - platform: epaper_spectra6_133
    id: epd
    spi_host: SPI3_HOST
    update_interval: never
    clk_pin: ${epd_clk_pin}
    data0_pin: ${epd_data0_pin}
    data1_pin: ${epd_data1_pin}
    cs0_pin: ${epd_cs0_pin}
    cs1_pin: ${epd_cs1_pin}
    busy_pin: ${epd_busy_pin}
    reset_pin: ${epd_reset_pin}
    power_pin: ${epd_power_pin}
    clear_color: white
    change_detection_mode: track
    auto_sleep: true
    power_off_after_sleep: true
    lambda: |-
